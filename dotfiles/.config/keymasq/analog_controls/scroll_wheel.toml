name = "Scroll Wheel"
input_type = "stick"
description = "Scroll up/down with the stick, ramping across four speed bands"

# Emits REL_WHEEL_HI_RES rather than REL_WHEEL. A legacy wheel event is one
# whole notch - typically 3 lines - so it can only ever step, which is why this
# felt juddery while a real mouse feels smooth: mice send hi-res, and libinput
# turns it into fractional scrolling. 120 hi-res units = 1 notch = ~3 lines.
#
# Four bands so the ramp uses the whole stick rather than topping out early,
# with a distinct jump reserved for the last few percent of travel:
#   0.15-0.61   5/pulse   ~4 lines/sec   reading
#   0.63-0.88  12/pulse  ~10 lines/sec   skimming
#   0.90-0.96  26/pulse  ~21 lines/sec   moving
#   0.98-1.00  70/pulse  ~58 lines/sec   pinned against the stop
# Boundaries come from measuring where the stick was actually held, not from
# dividing the range evenly: this pad pins at raw 255 before its mechanical
# stop, so the top band has to trigger at the pin or it fires early.
# Rate is fixed at ~33 pulses/sec; only the per-pulse value changes, so speed is
# proportional to these numbers. Release ranges overlap the trigger ranges so
# bands hand over without chatter. If the view creeps with the stick at rest,
# raise the 0.15/0.10 floors.

[mouse_motion]
enabled = false

[gamepad_output]
enabled = false

# --- Up: negative y, wheel positive ---
[[thresholds]]
axis = "y"
trigger_min = -0.61
trigger_max = -0.15
release_min = -0.63
release_max = -0.1

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:5"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "y"
trigger_min = -0.88
trigger_max = -0.63
release_min = -0.9
release_max = -0.61

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:12"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "y"
trigger_min = -0.965
trigger_max = -0.9
release_min = -0.985
release_max = -0.88

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:26"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "y"
trigger_min = -1.0
trigger_max = -0.985
release_min = -1.0
release_max = -0.965

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:70"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

# --- Down: positive y, wheel negative ---
[[thresholds]]
axis = "y"
trigger_min = 0.15
trigger_max = 0.61
release_min = 0.1
release_max = 0.63

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:-5"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "y"
trigger_min = 0.63
trigger_max = 0.88
release_min = 0.61
release_max = 0.9

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:-12"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "y"
trigger_min = 0.9
trigger_max = 0.965
release_min = 0.88
release_max = 0.985

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:-26"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "y"
trigger_min = 0.985
trigger_max = 1.0
release_min = 0.965
release_max = 1.0

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:-70"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

# --- Sideways: single band, rarely used ---
[[thresholds]]
axis = "x"
trigger_min = -1.0
trigger_max = -0.55
release_min = -1.0
release_max = -0.45

[[thresholds.actions]]
action = "mouse"
target = "rel_hwheel_hi_res:-24"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "x"
trigger_min = 0.55
trigger_max = 1.0
release_min = 0.45
release_max = 1.0

[[thresholds.actions]]
action = "mouse"
target = "rel_hwheel_hi_res:24"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25
