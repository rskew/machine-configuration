name = "Scroll Wheel"
input_type = "stick"
description = "Scroll up/down with the stick: slow everywhere, fast only at the stop"

# Emits REL_WHEEL_HI_RES rather than REL_WHEEL, so libinput reports a fine-grained
# wheel rather than one whole notch per event. 120 hi-res units = 1 notch, and one
# notch is 1 line everywhere (see kitty's wheel_scroll_multiplier, herdr's
# mouse_scroll_lines and niri's window scroll-factor), so these numbers are the
# only thing setting the stick's speed and they mean the same in every window.
#
# Deliberately not a ramp: the whole usable travel is one slow reading speed, and
# fast only exists pinned against the stop. niri multiplies wheel value120 by 3,
# and the pulse rate is fixed at ~33/sec, so lines per second is per-pulse x 0.825:
#     0.15-0.98    10/pulse    ~8 lines/sec   reading
#     0.985-1.00  126/pulse  ~104 lines/sec   pinned against the stop
# This pad pins at raw 255 before its mechanical stop, so the fast band has to
# trigger at the pin (0.985) or it fires early. Release ranges overlap the trigger
# ranges so the handover doesn't chatter. If the view creeps with the stick at
# rest, raise the 0.15/0.10 floors.

[mouse_motion]
enabled = false

[gamepad_output]
enabled = false

# --- Up: negative y, wheel positive ---
[[thresholds]]
axis = "y"
trigger_min = -0.98
trigger_max = -0.15
release_min = -0.985
release_max = -0.1

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:10"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "y"
trigger_min = -1.0
trigger_max = -0.985
release_min = -1.0
release_max = -0.975

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:126"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

# --- Down: positive y, wheel negative ---
[[thresholds]]
axis = "y"
trigger_min = 0.15
trigger_max = 0.98
release_min = 0.1
release_max = 0.985

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:-10"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "y"
trigger_min = 0.985
trigger_max = 1.0
release_min = 0.975
release_max = 1.0

[[thresholds.actions]]
action = "mouse"
target = "rel_wheel_hi_res:-126"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

# --- Sideways: single band, rarely used ---
[[thresholds]]
axis = "x"
trigger_min = -1.0
trigger_max = -0.55
release_min = -1.0
release_max = -0.45

[[thresholds.actions]]
action = "mouse"
target = "rel_hwheel_hi_res:-12"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25

[[thresholds]]
axis = "x"
trigger_min = 0.55
trigger_max = 1.0
release_min = 0.45
release_max = 1.0

[[thresholds.actions]]
action = "mouse"
target = "rel_hwheel_hi_res:12"
rapidfire_enabled = true
rapidfire_hold_ms = 5
rapidfire_wait_ms = 25
