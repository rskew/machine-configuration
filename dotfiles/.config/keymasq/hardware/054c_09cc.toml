[hardware]
name = "Wireless Controller"
vendor_id = "054c"
product_id = "09cc"

[[hardware.evdev.devices]]
path = "keymasq:054c:09cc"
type = "gamepad"
id = "gamepad"
capabilities = [
    "btn_south",
    "btn_east",
    "btn_north",
    "btn_west",
    "btn_tl",
    "btn_tr",
    "btn_tl2",
    "btn_tr2",
    "btn_select",
    "btn_start",
    "btn_mode",
    "btn_thumbl",
    "btn_thumbr",
    "abs_x",
    "abs_y",
    "abs_z",
    "abs_rx",
    "abs_ry",
    "abs_rz",
    "abs_hat0x",
    "abs_hat0y",
]

[hardware.layout]
type = "gamepad"

# Labels are what is printed on this pad, verified with evtest rather than
# taken from the DS4 identity it claims over Bluetooth. Face buttons are
# PlayStation glyphs in NESW order: triangle, circle, cross, square.
[[hardware.layout.buttons]]
id = "btn_south"
label = "Cross"
evdev = "btn_south"
evdev_code = 304
source = "gamepad"
type = "gamepad"

