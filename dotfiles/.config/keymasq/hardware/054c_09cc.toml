# The arrow buttons (the d-pad) are not four separate buttons: they arrive as
# two axes reporting -1 / 0 / 1, so they have to be driven through an analog
# control's thresholds rather than button mappings.
# Verified: hat0y -1 = up, +1 = down; hat0x -1 = left, +1 = right.
[[hardware.layout.analogs]]
id = "dpad"
label = "Arrow Buttons"
type = "stick"
source = "gamepad"
axes = [
    { role = "x", evdev = "abs_hat0x", evdev_code = 16 },
    { role = "y", evdev = "abs_hat0y", evdev_code = 17 },
]

[[hardware.layout.analogs]]
id = "left_stick"
label = "Left Stick"
type = "stick"
source = "gamepad"
axes = [
    { role = "x", evdev = "abs_x", evdev_code = 0 },
    { role = "y", evdev = "abs_y", evdev_code = 1 },
]

[[hardware.layout.analogs]]
id = "right_stick"
label = "Right Stick"
type = "stick"
source = "gamepad"
axes = [
    { role = "x", evdev = "abs_rx", evdev_code = 3 },
    { role = "y", evdev = "abs_ry", evdev_code = 4 },
]

[[hardware.layout.analogs]]
id = "left_trigger"
label = "Left Trigger"
type = "axis"
source = "gamepad"
axes = [
    { role = "x", evdev = "abs_z", evdev_code = 2 },
]

[[hardware.layout.analogs]]
id = "right_trigger"
label = "Right Trigger"
type = "axis"
source = "gamepad"
axes = [
    { role = "x", evdev = "abs_rz", evdev_code = 5 },
]
