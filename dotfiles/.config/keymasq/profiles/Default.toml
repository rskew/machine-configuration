[profile]
name = "Default"
enabled = true
is_permanent = true
priority = 0
notify_on_activation = false
created_at = "2026-08-30T23:30:43.282299"

# Scoped to herdr by choosing keys nothing else binds. F13-F15 are unclaimed by
# every other application, so the pad is inert outside herdr without needing
# anything to watch window focus. Arrow keys and Enter are deliberately global:
# niri's own pane and workspace bindings are all Mod+arrow, so the pad cannot
# move you between applications. Switching apps stays a keyboard job.

[devices."054c:09cc"]
always_grab_all = false

# --- Shoulders: tab switching within the one herdr session ---
[devices."054c:09cc".mapping.btn_tl]
action = "keyboard"
target = "key_f13"

[devices."054c:09cc".mapping.btn_tr]
action = "keyboard"
target = "key_f14"

# --- L2 held: push-to-talk. A trigger because it is held for seconds at a
# time, and an index finger leaves both thumbs free to scroll and answer while
# talking. The superkey is what gives us a release event; a plain exec action
# only fires on press.
[devices."054c:09cc".mapping.btn_tl2]
action = "superkey"
superkey_name = "Push To Talk"

# --- Cross: submit. Typing also snaps the pane scrollback to the bottom, so
# this doubles as the jump-to-bottom gesture.
[devices."054c:09cc".mapping.btn_south]
action = "keyboard"
target = "key_enter"

# --- Circle: clear the entered text. ctrl+u rather than ctrl+c because it clears
# without interrupting, and it means the same thing in all three places dictation
# lands: herdr's own prompts, fish, and a code agent's input box.
[devices."054c:09cc".mapping.btn_east]
action = "macro"
target = "ctrl_u"

# --- Square: new tab. herdr prompts for the name, so the rest of the flow is
# already on the pad: hold L2 to speak the name, Cross to accept, L2 again to
# speak a command into the fresh shell, then Up to run fish's history search
# over it.
[devices."054c:09cc".mapping.btn_west]
action = "keyboard"
target = "key_f15"

# --- Triangle: ctrl+d, to close a tab whose work is done. Only takes effect at
# an empty prompt, so it cannot interrupt a running agent the way Circle does.
[devices."054c:09cc".mapping.btn_north]
action = "macro"
target = "ctrl_d"

# --- Arrow buttons: arrow keys ---
[devices."054c:09cc".mapping.dpad]
action = "analog_control"
analog_control_name = "Arrow Buttons"

# --- Right stick: scroll ---
[devices."054c:09cc".mapping.right_stick]
action = "analog_control"
analog_control_name = "Scroll Wheel"

# Left stick and the stick clicks are deliberately unmapped. They drove the
# system mouse cursor, which is useless in a TUI and was the one part of this
# setup that leaked outside herdr. Restore them here if you want them back.
